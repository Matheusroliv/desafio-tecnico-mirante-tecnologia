[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modernize"
version = "0.2.0"
description = "Pipeline hibrida de modernizacao PL/pgSQL para Python 3.14."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-cli[inmem]>=0.4,<0.5",
    "langgraph-api>=0.15",
    "fastapi>=0.115",
    "pydantic>=2.10,<3",
    "pglast>=8.4,<9",
    "psycopg[binary]>=3.2,<4",
    "openai>=1.60",
    "langfuse>=4,<5",
    "ruff>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "httpx>=0.27",
    "mypy>=1.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=modernize --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: precisa de PostgreSQL (DATABASE_URL / LEGACY_DATABASE_URL); pulado quando o banco nao responde",
]

[tool.coverage.run]
source = ["modernize"]
omit = [
    # Executado so em subprocesso pela metrica de equivalencia; coberto pelo teste de integracao via subprocess.
    "*/modernize/evaluation/equivalence_worker.py",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src/modernize"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
