[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modernize"
version = "0.1.0"
description = "Pipeline hibrida de modernizacao PL/pgSQL para Python."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-cli>=0.2",
    "fastapi>=0.115",
    "pydantic>=2",
    "pglast>=8",
    "psycopg[binary]>=3",
    "openai>=1",
    "langfuse>=3",
    "ruff>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: precisa de PostgreSQL",
]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
